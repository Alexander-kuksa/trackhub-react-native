name: React Native SDK package
on:
  push:
    branches: [main]
    tags: ['*']
  pull_request:
permissions:
  contents: read
jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: trackhub-react-native-package
          path: '*.tgz'
          if-no-files-found: error
